window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const E3 = "power3.out";
function pop(s, t, d = 0.35) { tl.fromTo(s, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: d, ease: "back.out(2)" }, t); }
function rise(s, t, d = 0.4) { tl.fromTo(s, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: d, ease: E3 }, t); }
function fade(s, t, d = 0.3, to = 0) { tl.to(s, { opacity: to, duration: d }, t); }
function draw(s, t, d = 0.45) { tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, t); }
function slam(s, t, r = -2) { tl.fromTo(s, { scale: 1.5, opacity: 0, rotation: r - 6 }, { scale: 1, opacity: 1, rotation: r, duration: 0.32, ease: "back.out(1.8)" }, t); }
function bob(s, t, d, a = 1.6) { const n = Math.max(1, Math.round(d / 1.4)); tl.fromTo(s, { rotation: -a / 2 }, { rotation: a / 2, duration: d / n, yoyo: true, repeat: n - 1, ease: "sine.inOut", transformOrigin: "50% 100%" }, t); }
function floaty(s, t, d, a = 10) { const n = Math.max(2, 2 * Math.round(d / 2.4)); tl.fromTo(s, { y: 0 }, { y: -a, duration: d / n, yoyo: true, repeat: n - 1, ease: "sine.inOut" }, t); }
function cam(s, t, d, from, to) { tl.fromTo(s, { scale: from }, { scale: to, duration: d, ease: "sine.inOut" }, t); }
